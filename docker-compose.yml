services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: kusakari
      MYSQL_USER: kusakari
      MYSQL_PASSWORD: ${KUSAKARI_DB_PASSWORD:-password}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - kusakari-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      KUSAKARI_API_PORT: 8086
      KUSAKARI_DB_URL: jdbc:mysql://mysql:3306/kusakari?connectionTimeZone=UTC
      KUSAKARI_E2E_DB_URL: jdbc:mysql://mysql:3306/kusakari_e2e?connectionTimeZone=UTC
      KUSAKARI_DB_PORT: 3306
      KUSAKARI_DB_USER: kusakari
      KUSAKARI_DB_PASSWORD: ${KUSAKARI_DB_PASSWORD:-password}
      KUSAKARI_WEB_ORIGIN: http://localhost:${KUSAKARI_WEB_HOST_PORT:-5186}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${KUSAKARI_API_HOST_PORT:-8086}:8086"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "${KUSAKARI_WEB_HOST_PORT:-5186}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kusakari-mysql:
