name: Improvement / Refactor
description: 改善・リファクタリング・技術的負債の解消
title: "[Improve] "
labels:
  - Improvement

body:
  - type: textarea
    id: target
    attributes:
      label: 改善対象
      description: どの部分を改善するのか記載してください。
      placeholder: 例）ProductServiceの商品登録処理
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 現在の問題
      description: 現在どのような問題があるのか記載してください。
      placeholder: |
        例）
        - Controllerに業務ロジックが集中している
        - 同じ処理が複数箇所に重複している
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 改善内容
      description: どのように変更する予定か記載してください。
      placeholder: |
        例）
        - 業務ロジックをServiceへ移動
        - 重複処理を共通メソッドへまとめる
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 改善完了と判断する条件を記載してください。
      placeholder: |
        例）
        - 重複コードがなくなっている
        - 既存機能の動作が変わっていない
        - テストがすべて成功する
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: 影響する画面、API、クラスなどを記載してください。